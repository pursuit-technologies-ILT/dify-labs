# Merged automatically when running compose from vendor/dify/docker
# because Compose loads docker-compose.override.yml beside docker-compose.yaml.
#
# Goals:
# - Attach to shared lab_net for Open WebUI ↔ Dify
# - Keep plugin debug port on loopback only
# - Avoid publishing DB / Redis / Weaviate

services:
  nginx:
    networks:
      - default
      - lab_net

  api:
    networks:
      - default
      - ssrf_proxy_network
      - lab_net

  plugin_daemon:
    ports: !override
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-15003}:${PLUGIN_DEBUGGING_PORT:-5003}"

networks:
  lab_net:
    name: lab_net
    external: true
