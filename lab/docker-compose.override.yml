# Merged automatically when running compose from vendor/dify/docker.
#
# Keep plugin debug on loopback. Do NOT attach api to extra networks —
# multi-network DNS breaks redis hostname resolution in this sandbox.
# Open WebUI reaches Dify via host port 3847 (host.docker.internal).

services:
  nginx:
    networks:
      - default
      - lab_net

  plugin_daemon:
    ports: !override
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-15003}:${PLUGIN_DEBUGGING_PORT:-5003}"

networks:
  lab_net:
    name: lab_net
    external: true
