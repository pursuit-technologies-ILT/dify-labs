# Open WebUI — trainee-facing ChatGPT-style portal for the lab.
# Shares lab_net with Dify (Dify override marks lab_net external once created here).

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:slim
    container_name: lab-open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_HOST_PORT:-3848}:8080"
    environment:
      - WEBUI_NAME=Enterprise Training Lab
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-lab-change-me-generate-with-openssl}
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_USER_ROLE=user
      - ENABLE_SIGNUP=true
      - ENABLE_LOGIN_FORM=true
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lab_net

volumes:
  open-webui-data:

networks:
  lab_net:
    name: lab_net
